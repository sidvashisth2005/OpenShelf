name: Release

# Push a tag like v0.2.0 (matching package.json "version") to publish a release
# with OpenShelf.exe + the app bundle. Notes come from RELEASE_NOTES.md; put
# <!-- notify-users --> in it to show the in-app update popup. See RELEASING.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Empty unless the repository secret exists; gates the optional signing step.
      CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run bundle
      - run: npm run build:exe

      - name: Self-test the installer against the fresh bundle
        shell: pwsh
        env:
          OPENSHELF_ADMIN_PASSWORD: ci-only-password-not-secret
        run: |
          $p = Start-Process dist\OpenShelf.exe -ArgumentList @('--yes','--dir',"$env:RUNNER_TEMP\os-install",'--app-zip','dist\openshelf-app.zip','--admin-email','ci@example.test','--no-shortcuts','--no-launch') -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }

      # Optional Authenticode signing. It runs only when the repository has the secrets
      # WINDOWS_CERT_PFX_BASE64 + WINDOWS_CERT_PASSWORD (see RELEASING.md > Code signing).
      - name: Sign OpenShelf.exe
        if: ${{ env.CERT_PFX != '' }}
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "OpenShelf Installer" /f $pfx /p $env:CERT_PASSWORD dist\OpenShelf.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item $pfx
          & $signtool.FullName verify /pa dist\OpenShelf.exe

      - name: Write the installer checksum (after signing)
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\OpenShelf.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist\OpenShelf.exe.sha256 -Value "$hash  OpenShelf.exe" -NoNewline -Encoding ascii

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "OpenShelf ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md \
            dist/OpenShelf.exe dist/OpenShelf.exe.sha256 dist/openshelf-app.zip dist/openshelf-app.zip.sha256
